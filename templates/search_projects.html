
<!DOCTYPE html>
<html>
<head>
    <title>Search Projects</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #003366;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header-title {
            margin: 0;
        }
        .header-buttons {
            display: flex;
            gap: 15px;
        }
        .header-buttons a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            background-color: #001a33;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        .header-buttons a:hover {
            background-color: #004080;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .search-section {
            width: 100%;
            max-width: 600px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #003366;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #003366;
            outline: none;
        }
        button.primary {
            padding: 10px 15px;
            background-color: #003366;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
        }
        button.primary:hover {
            background-color: #001a33;
        }
        footer {
            background-color: #001a33;
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <header>
        <h1 class="header-title">Search Projects</h1>
        <div class="header-buttons">
            <a href="/profile">Profile</a>
            <a href="/logout">Logout</a>
        </div>
    </header>
    <div class="container">
        <button onclick="window.location.href='/dashboard'" class="primary">Return to Dashboard</button>
        <div class="search-section" style="margin-top: 20px;">
            <form method="POST" action="/search-projects">
                <div class="form-group">
                    <label for="projectName">Project Name</label>
                    <input type="text" id="projectName" name="project_name" placeholder="Enter project name">
                </div>
                <p><strong>Fallback Criteria (if no results):</strong></p>
                <div class="form-group">
                    <label for="projectAddress">Address</label>
                    <input type="text" id="projectAddress" name="project_address" placeholder="Enter project address">
                </div>
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="Enter city">
                </div>
                <div class="form-group">
                    <label for="province">Province</label>
                    <select id="province" name="province">
                        <option value="">Select Province</option>
                        <option value="AB">Alberta</option>
                        <option value="BC">British Columbia</option>
                        <option value="MB">Manitoba</option>
                        <option value="NB">New Brunswick</option>
                        <option value="NL">Newfoundland and Labrador</option>
                        <option value="NS">Nova Scotia</option>
                        <option value="NT">Northwest Territories</option>
                        <option value="NU">Nunavut</option>
                        <option value="ON">Ontario</option>
                        <option value="PE">Prince Edward Island</option>
                        <option value="QC">Quebec</option>
                        <option value="SK">Saskatchewan</option>
                        <option value="YT">Yukon</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="postalCode">Postal/Zip Code</label>
                    <input type="text" id="postalCode" name="postal_code" placeholder="Enter postal/zip code">
                </div>
                <button type="submit" class="primary">Search</button>
            </form>
        </div>
    </div>
    <footer>
        <p>&copy; 2024 Construction Portal. All rights reserved.</p>
    </footer>
</body>
</html>
