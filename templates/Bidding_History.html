<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bidding History | ConstructHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/biddingHistory.css') }}">

</head>

<body>
    {% include 'sidebar.html' %}

    <div class="main-content">
        <div class="container">
            <h1>Bidding History</h1>

            <div class="filter-section">
                <input type="text" id="projectIDFilter" placeholder="Search by Project ID" onkeyup="filterProjects()">
                <input type="text" id="projectNameFilter" placeholder="Search by Project Name" onkeyup="filterProjects()">
            </div>
    
            <table id="biddingTable">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Project ID</th>
                        <th onclick="sortTable(1)">Project Name</th>
                        <th onclick="sortTable(2)">Closing Date</th>
                        <th onclick="sortTable(3)">Project Value ($)</th>
                    </tr>
                </thead>
                <tbody id="bidding_history_tbody">
                </tbody>
            </table>
        </div>
    </div>

    {% include 'footer.html' %}

    <div id="projectModal" class="popup-overlay" style="display:none;">
        <div class="popup-content">
            <div id="modal_content">
            </div>
            <div class="modalBtn">
                <button id="modalClose">close</button>
            </div>
        </div>
    </div>

    <script>
        function filterProjects() {
            const idFilter = document.getElementById('projectIDFilter').value.toLowerCase();
            const nameFilter = document.getElementById('projectNameFilter').value.toLowerCase();
            const projects = document.querySelectorAll('#biddingTable tbody tr');

            projects.forEach(project => {
                const id = project.cells[0].textContent.toLowerCase();
                const name = project.cells[1].textContent.toLowerCase();

                const matchesID = id.includes(idFilter);
                const matchesName = name.includes(nameFilter);

                project.style.display = (matchesID && matchesName) ? '' : 'none';
            });
        }

        function sortTable(columnIndex) {
            const table = document.getElementById('biddingTable');
            const rows = Array.from(table.rows).slice(1);
            const ascending = table.dataset.sortOrder !== 'asc';

            rows.sort((rowA, rowB) => {
                const a = rowA.cells[columnIndex].textContent;
                const b = rowB.cells[columnIndex].textContent;

                if (columnIndex === 3) {
                    return ascending ? a - b : b - a;
                } else if (columnIndex === 2) {
                    return ascending ? new Date(a) - new Date(b) : new Date(b) - new Date(a);
                } else {
                    return ascending ? a.localeCompare(b) : b.localeCompare(a);
                }
            });

            rows.forEach(row => table.tBodies[0].appendChild(row));
            table.dataset.sortOrder = ascending ? 'asc' : 'desc';

            table.querySelectorAll('th').forEach(th => th.classList.remove('sorted-desc'));
            table.querySelector(`th:nth-child(${columnIndex + 1})`).classList.toggle('sorted-desc', !ascending);
        }
    </script>
    <script>
        fetch('/bidding_history/table')
            .then(response => response.json())
            .then(data => {
                let tableBody = document.getElementById("bidding_history_tbody");
                // Clear the existing table body
                tableBody.innerHTML = '';

                // Iterate over the data and append each row
                data.forEach(bid => {
                    const date = new Date(bid.closingDate);
                    const options = { year: 'numeric', month: 'long', day: 'numeric' };
                    const formattedDate = date.toLocaleDateString('en-US', options);
                    tableBody.innerHTML += `
        <tr>
            <td>${bid.formatted_project_id}</td>
            <td onclick="getBidModalData(${bid.project_id})" style="cursor: pointer;">${bid.projectName}</td>
            <td>${formattedDate}</td>
            <td>${bid.totalAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
        </tr>
    `;
                });
            })
            .catch(error => console.error('Error fetching data:', error));
    </script>

    <script>
        function showLogoutPopup() {
            document.getElementById('logoutPopup').style.display = 'flex';
        }

        function closeLogoutPopup() {
            document.getElementById('logoutPopup').style.display = 'none';
            document.getElementById('projectModal').style.display = 'none';
        }
        document.getElementById('modalClose').onclick = function () {
            document.getElementById('projectModal').style.display = 'none';
        }

        function confirmLogout() {
            window.location.href = '/logout';  // Redirect to the homepage
        }

        function getBidModalData(project_id) {

            fetch(`/bidding_history/modal/getData/${project_id}`)
                .then(response => response.json())
                .then(data => {
                    const date = new Date(data.closingDate);
                    const options = { year: 'numeric', month: 'long', day: 'numeric' };
                    const formattedDate = date.toLocaleDateString('en-US', options);
                    const userBidRow = data.user_bid ? `
            <tr>
                <td>${data.user_bid.project_id}</td>
                <td>$${data.user_bid.amount}</td>
                <td>Your Bid</td>
            </tr>
        ` : '';

                    const currentCompany = data.company_Id;

                    const otherBidsRows = data.all_bids
                        .sort((a, b) => a.totalAmount - b.totalAmount) // Sort by amount in ascending order
                        .map(bid => `
                                            <tr>
                                                <td>CH-${bid.project_id.toString().padStart(2, '0')}</td>
                                                <td>${bid.company_id === currentCompany ? bid.totalAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '***,***,***'}</td>
                                                <td class="${bid.company_id === currentCompany ? '' : 'blurred prevent-select'}">${bid.company}</td>
                                            </tr>
                            
                                `)
                                    .join('');

                    const categories_9 = ['Drywall', 'Flooring', 'Paint'];
                    const categories_15 = ['Plumbing & Refrigeration', 'Sprinklers', 'HVAC'];

                    const generateTables_9 = (bids) => {
                        return categories_9.map((category, index) => {
                            const sortedBids = bids.slice().sort((a, b) => {
                return Number(a.amount[`amount${index + 1}`]) - Number(b.amount[`amount${index + 1}`]);
            });
                            const rows = sortedBids.map(bid => {
                                const amount = bid.amount[`amount${index + 1}`];
                                return `
                                    <tr>
                                        <td>$ ${bid.company_id === currentCompany 
    ? Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) 
    : '***,***,***'}</td>
                                        <td class="${bid.company_id === currentCompany ? '' : 'blurred prevent-select'}">${bid.company}</td>
                                    </tr>
                                `;
                            }).join('');

                            return `
                                <div class="table-container" style=" margin-bottom: 20px;">
                                    <h3>${category}</h3>
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Bid Value ($)</th>
                                                <th>Bidder</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${rows}
                                        </tbody>
                                    </table>
                                </div>
                            `;
                        }).join('');
                    };

                    const generateTables_15 = (bids) => {
                        return categories_15.map((category, index) => {
                            const sortedBids = bids.slice().sort((a, b) => {
                return Number(a.amount[`amount${index + 1}`]) - Number(b.amount[`amount${index + 1}`]);
            });
                            const rows = sortedBids.map(bid => {
                                const amount = bid.amount[`amount${index + 1}`];
                                return `
                                    <tr>
                                        <td>$ ${bid.company_id === currentCompany 
    ? Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) 
    : '***,***,***'}</td>
                                        <td class="${bid.company_id === currentCompany ? '' : 'blurred prevent-select'}">${bid.company}</td>
                                    </tr>
                                `;
                            }).join('');

                            return `
                                <div class="table-container" style=" margin-bottom: 20px;">
                                    <h3>${category}</h3>
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Bid Value ($)</th>
                                                <th>Bidder</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${rows}
                                        </tbody>
                                    </table>
                                </div>
                            `;
                        }).join('');
                    };


                    document.getElementById('modal_content').innerHTML = `
                        <h1 id="modalProjectName">Project Name: ${data.projectName}</h1>
                        <p id="modaladdress">Project Address: ${data.project_address}</p>
                        <p id="modalClosingDate">Closing Date: ${formattedDate}</p>
                        <p id="modaldivision">Division: ${data.division == 1 ? "General Contractor"
                                        : data.division == 2 ? "Demolition"
                                        : data.division == 3 ? "Concrete"
                                        : data.division == 4 ? "Masonry"
                                        : data.division == 5 ? "Metals"
                                        : data.division == 6 ? "Wood and plastics"
                                        : data.division == 7 ? "Thermal and moisture protection"
                                        : data.division == 8 ? "Doors and windows"
                                        : data.division == 9 ? "Finishes"
                                        : data.division == 10 ? "Specialties"
                                        : data.division == 11 ? "Equipment"
                                        : data.division == 12 ? "Furnishings"
                                        : data.division == 13 ? "Special construction"
                                        : data.division == 14 ? "Conveying systems"
                                        : data.division == 15 ? "Mechanical"
                                        : "Electrical"
                                    }</p>
${data.division == 9 
    ? generateTables_9(data.all_bids) 
    : data.division == 15 
        ? generateTables_15(data.all_bids) 
        : `<table>
            <thead>
                <tr>
                    <th>Project Number</th>
                    <th>Bid Value ($)</th>
                    <th>Bidder</th>
                </tr>
            </thead>
            <tbody>
                ${otherBidsRows} <!-- Ensure that otherBidsRows is defined and contains valid HTML -->
            </tbody>
        </table>`}
        `;
                    document.getElementById('projectModal').style.display = "flex";
                });
        }

        function closeModal() {
            document.getElementById('projectModal').style.display = "none";
        }
    </script>

</body>

</html>
