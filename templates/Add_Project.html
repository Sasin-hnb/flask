<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Project | ConstructHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/dashboard_global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/add_project.css') }}">
</head>

<body>
    <!-- Sidebar Navigation -->
    {% include 'sidebar.html' %}

    <div class="main-content">
        <div class="container">
            <h1>Project Entry</h1>
            <form>
                <div class="layout">
                    <label for="closingDate">Anticipated Closing Date</label>
                    <input type="date" id="closingDate" name="closingDate" class="input-field" required>
                </div>
                <div class="layout">
                    <label for="projectName">Project Name</label>
                    <input type="text" id="projectName" name="projectName" class="input-field" required>
                </div>
                <div class="layout">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" class="input-field" required>
                </div>
                <div class="layout">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" class="input-field" required>
                </div>
                <div class="form-row layout" >
                    <label for="province">Province</label>
                    <select id="province" name="province" class="input-field" required>
                        <option value="">Select Province</option>
                        <option value="Alberta">Alberta</option>
                        <option value="British Columbia">British Columbia</option>
                        <option value="Manitoba">Manitoba</option>
                        <option value="New Brunswick">New Brunswick</option>
                        <option value="Newfoundland and Labrador">Newfoundland and Labrador</option>
                        <option value="Nova Scotia">Nova Scotia</option>
                        <option value="Ontario">Ontario</option>
                        <option value="Prince Edward Island">Prince Edward Island</option>
                        <option value="Manitoba">Manitoba</option>
                        <option value="Quebec">Quebec</option>
                        <option value="Saskatchewan">Saskatchewan</option>
                    </select>
                </div>
                <div class="layout">
                    <label for="postalCode">PostalCode</label>
                    <input type="text" id="postalCode" name="postalCode" class="input-field" required>
                </div>
                <div>
                    <input type="button" value="save" onclick="add_project()">
                </div>
            </form>
        </div>

    </div>

    {% include 'footer.html' %}


            <script>
                const valueFields = document.querySelectorAll('.value-field');
                const totalValueField = document.getElementById('totalValue');

                function calculateTotal() {
                    let total = 0;
                    valueFields.forEach(field => {
                        total += parseFloat(field.value) || 0;
                    });
                    totalValueField.value = total.toFixed(2);
                }

                valueFields.forEach(field => {
                    field.addEventListener('input', calculateTotal);
                });
            </script>

            <script>
                function add_project() {
                    const closingDate = document.getElementById('closingDate').value;
                    const projectName = document.getElementById('projectName').value;
                    const address = document.getElementById('address').value;
                    const city = document.getElementById('city').value;
                    const province = document.getElementById('province').value;
                    const postalCode = document.getElementById('postalCode').value;

                    const data = {
                        closingDate: closingDate,
                        projectName: projectName,
                        address: address,
                        city: city,
                        province: province,
                        postalCode: postalCode
                    }

                    fetch('/add_project', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    }).then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                        .then(data => {
                            window.location.href = '/Project_Search'
                        })
                        .catch(error => {
                            console.error('Error updating user:', error);
                        });
                }
            </script>

        <script>
            function showLogoutPopup() {
                document.getElementById('logoutPopup').style.display = 'flex';
            }

            function closeLogoutPopup() {
                document.getElementById('logoutPopup').style.display = 'none';
            }

            function confirmLogout() {
                window.location.href = '/logout';  // Redirect to the homepage
            }
        </script>


</body>

</html>
