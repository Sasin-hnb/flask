
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Construction Portal</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        /* Hero Section */
        .hero {
            background-image: url('static/images/background_image.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .hero h1 {
            font-size: 3em;
            margin: 0;
            z-index: 1;
        }

        .hero p {
            font-size: 1.2em;
            z-index: 1;
        }

        .hero a {
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #003366;
            color: white;
            font-size: 1.2em;
            text-decoration: none;
            border-radius: 5px;
            z-index: 1;
            transition: background-color 0.3s ease;
        }

        .hero a:hover {
            background-color: #d0e0f5;
            color: #003366;
        }

        /* Header Section */
        .header {
            background-color: #003366;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .header .logo {
            font-size: 1.5em;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 1.2em;
        }

        .header a:hover {
            text-decoration: underline;
        }

        /* Footer Section */
        .footer {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 15px 20px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5em;
            }

            .hero p {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <div class="header">
                <div class="left-nav">
            <!-- Logo link -->
            <a href="/">
                <img src="static/images/constructhub-logo.png" alt="ConstructHub Logo" class="logo">
            </a>
        </div>
        <nav>
            <a href="/register">Register</a>
            <a href="/login">Login</a>
        </nav>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Welcome to the ConstructHub</h1>
        <p>A Central Hub To Track and Benchmark Your Construction Proposals.</p>
        <a href="/register">Get Started</a>
    </div>

    <!-- Footer Section -->
    <div class="footer">
        &copy; 2024 ConstructHub. All rights reserved.
    </div>
</body>
</html>
