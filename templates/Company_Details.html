<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard | ConstructHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/dashboard_global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/company_detail.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- Sidebar Navigation -->
    {% include 'sidebar.html' %}

    <!-- Main Content -->
    <div class="main-content">
        <!-- Notification Icons -->
        <div class="notifications">
            <img src="/static/Tabs/Globe_Icon.png" alt="Community Notifications" title="Community Notifications">
            <img src="/static/Tabs/Bell_Icon.png" alt="Project Alerts" title="Project Alerts">
        </div>

        <!-- Main Content -->
        <div class="container">
            <h1>Company Details</h1>
            <div class="section" id="company_manage_detail">
            </div>
        </div>
    </div>

    <div id="editUserModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Edit User</h2>
            <input type="hidden" id="userId" name="userId">
            <div>
                <label for="companyName">companyName:</label>
                <input type="text" id="companyName" name="companyName" required>
            </div>
            <div>
                <label for="phoneNumber">phoneNumber:</label>
                <input type="text" id="phoneNumber" name="phoneNumber" required>
            </div>
            <div>
                <label for="address">address:</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div>
                <label for="website">website:</label>
                <input type="text" id="website" name="website" required>
            </div>
            <div class="form-group">
                <label for="division">Division</label>
                <select id="division" name="division" required disabled>
                    <option value="">Select your division</option>
                    <option value="1">General Contractor</option>
                    <option value="2">Division 2: Demolition</option>
                    <option value="3">Division 3: Concrete</option>
                    <option value="4">Division 4: Masonry</option>
                    <option value="5">Division 5: Metals</option>
                    <option value="6">Division 6: Wood and plastics</option>
                    <option value="7">Division 7: Thermal and moisture protection</option>
                    <option value="8">Division 8: Doors and windows</option>
                    <option value="9">Division 9: Finishes</option>
                    <option value="10">Division 10: Specialties</option>
                    <option value="11">Division 11: Equipment</option>
                    <option value="12">Division 12: Furnishings</option>
                    <option value="13">Division 13: Special construction</option>
                    <option value="14">Division 14: Conveying systems</option>
                    <option value="15">Division 15: Mechanical</option>
                    <option value="16">Division 16: Electrical</option>
                </select>
            </div>
            <div>
                <label for="firstName">firstName:</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>
            <div>
                <label for="lastName">lastName:</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>
            <div>
                <label for="email">email:</label>
                <input type="text" id="email" name="email" required>
            </div>
            <div>
                <label for="mobileNumber">mobileNumber:</label>
                <input type="text" id="mobileNumber" name="mobileNumber" required>
            </div>
            <button id="edit_btn" onclick="updateCompany()">Save</button>
        </div>
    </div>

    <!-- Footer Section -->
    {% include 'footer.html' %}

    <script>
        function showLogoutPopup() {
            document.getElementById('logoutPopup').style.display = 'flex';
        }

        function closeLogoutPopup() {
            document.getElementById('logoutPopup').style.display = 'none';
        }

        function confirmLogout() {
            window.location.href = '/'  // Redirect to the homepage
        }
    </script>

    <script>
        let companyData
        fetch('/manage_company/detail')
            .then(responsive => responsive.json())
            .then(data => {
                companyData = data
                document.getElementById("company_manage_detail").innerHTML = `
                <h2>Company Profile</h2>
                <p><strong>Company Name:</strong>${data.companyName}</p>
                <p><strong>Business Phone Number:</strong> ${data.phoneNumber}</p>
                <p><strong>Company Address:</strong> ${data.address}</p>
                <p><strong>Website:</strong> <a href="#">${data.website}</a></p>
                <p><strong>Division(s):</strong>    ${data.division == 1 ? "General Contractor" 
                                                    : data.division == 2 ? "Demolition" 
                                                    : data.division == 3 ? "Concrete"
                                                    : data.division == 4 ? "Masonry"
                                                    : data.division == 5 ? "Metals"
                                                    : data.division == 6 ? "Wood and plastics"
                                                    : data.division == 7 ? "Thermal and moisture protection"
                                                    : data.division == 8 ? "Doors and windows"
                                                    : data.division == 9 ? "Finishes"
                                                    : data.division == 10 ? "Specialties"
                                                    : data.division == 11 ? "Equipment"
                                                    : data.division == 12 ? "Furnishings"
                                                    : data.division == 13 ? "Special construction"
                                                    : data.division == 14 ? "Conveying systems"
                                                    : data.division == 15 ? "Mechanical"
                                                    : "Electrical"
                                                }</p>
                <p><strong>Primary Contact Name:</strong> ${data.firstName} ${data.lastName}</p>
                <p><strong>Primary Contact Email:</strong> ${data.email}</p>
                <p><strong>Mobile Number:</strong>${data.mobileNumber}</p>
                <button class="button" onclick="openEditModal()">Edit Details</button>
            `
            })


        function openEditModal() {
            document.getElementById('userId').value = companyData.userId;
            document.getElementById('companyName').value = companyData.companyName;
            document.getElementById('phoneNumber').value = companyData.phoneNumber;
            document.getElementById('address').value = companyData.address;
            document.getElementById('website').value = companyData.website;
            document.getElementById('division').value = companyData.division;
            document.getElementById('firstName').value = companyData.firstName;
            document.getElementById('lastName').value = companyData.lastName;
            document.getElementById('email').value = companyData.email;
            document.getElementById('mobileNumber').value = companyData.mobileNumber;
            document.getElementById('editUserModal').style.display = 'block';
        }

        function updateCompany() {
            const userId = document.getElementById('userId').value;
            const companyName = document.getElementById('companyName').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const address = document.getElementById('address').value;
            const website = document.getElementById('website').value;
            const division = document.getElementById('division').value;
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const mobileNumber = document.getElementById('mobileNumber').value;

            const updateData = {
                companyName: companyName,
                phoneNumber: phoneNumber,
                address: address,
                website: website,
                division: division,
                firstName: firstName,
                lastName: lastName,
                email: email,
                mobileNumber: mobileNumber
            }

            fetch(`/manage_company/${userId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updateData)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    // Handle successful response (e.g., close modal)
                    closeModal();
                    window.location.reload()
                })
                .catch(error => {
                    console.error('Error updating user:', error);
                });
        }

        function closeModal() {
            document.getElementById('editUserModal').style.display = 'none';

        }
    </script>

</body>

</html>
