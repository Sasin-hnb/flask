<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | Construction Portal</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        /* Header Section */
        .header {
            background-color: #003366;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .header .logo {
            font-size: 1.5em;
        }

        /* Footer Section */
        .footer {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 15px 20px;
        }

        /* Registration Form */
        .registration-form {
            background-color: white;
            margin: 100px auto 30px;
            padding: 30px;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .registration-form h1 {
            text-align: center;
            color: #003366;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 1em;
            margin-bottom: 5px;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #003366;
            box-shadow: 0 0 3px rgba(0, 51, 102, 0.5);
        }

        .form-actions button {
            background-color: #003366;
            color: white;
            padding: 12px 20px;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .form-actions button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .form-actions button:hover:enabled {
            background-color: #d0e0f5;
            color: #003366;
        }

        /* Error Styling */
        .error {
            color: red;
            /* Makes the text red */
            font-size: 0.9em;
            /* Slightly smaller font size */
            margin-top: 5px;
            /* Adds space between input and error */
        }

        /* Terms and Conditions Styling */
        .terms {
            color: #777;
            /* Light grey text */
            font-size: 0.85em;
            /* Slightly smaller font */
            text-align: center;
            /* Centers the text */
            margin-top: 20px;
            /* Adds spacing from the form fields */
        }

        /* Footer Links Styling */
        .footer-links {
            text-align: center;
            /* Center align the links */
            margin-top: 20px;
            /* Add spacing from the form */
            font-size: 0.9em;
            /* Slightly smaller font */
            color: #555;
            /* Subtle grey color */
        }

        .footer-links a {
            color: #555;
            /* Link color */
            text-decoration: none;
            /* Remove underline */
            margin: 0 10px;
            /* Space between links */
        }

        .footer-links a:hover {
            text-decoration: underline;
            /* Add underline on hover */
            color: #003366;
            /* Highlight hover color */
        }

        /* Footer Links Styling */
        .footer-links {
            text-align: center;
            /* Center align the links */
            margin-top: 20px;
            /* Add spacing from the form */
            font-size: 0.9em;
            /* Slightly smaller font */
            color: #555;
            /* Subtle grey color */
        }

        .footer-links a {
            color: white;
            /* Link color */
            text-decoration: none;
            /* Remove underline */
            margin: 0 10px;
            /* Space between links */
        }

        .footer-links a:hover {
            text-decoration: underline;
            /* Add underline on hover */
            color: #003366;
            /* Highlight hover color */
        }

        .search-container {
            position: relative;
            width: 300px;
            margin: auto;
            padding-top: 50px;
        }

        #search-input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .dropdown {
            display: none;
            border: 1px solid #ccc;
            border-top: none;
            position: absolute;
            width: 45%;
            background-color: white;
            z-index: 1000;
        }

        .dropdown-item {
            padding: 8px;
            cursor: pointer;
        }

        .dropdown-item:hover {
            background-color: #f0f0f0;
        }
    </style>


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const companyNameInput = document.getElementById('BusinessName');
            const dropdown = document.getElementById('dropdown');

            const phoneInput = document.getElementById('BusinessPhone');
            const addressInput = document.getElementById('BusinessAddress');
            const countryInput = document.getElementById('country');
            const provinceInput = document.getElementById('province');
            const websiteInput = document.getElementById('BusinessWebsite');

            companyNameInput.addEventListener('input', function () {
                const query = companyNameInput.value;
                console.log(query)

                // Hide the company details initially
                resetCompanyDetails();

                if (query) {
                    // Fetch companies matching the query from the backend
                    fetch(`/register/company?query=${query}`)
                        .then(response => response.json())
                        .then(data => {
                            console.log("data: ", data)
                            dropdown.innerHTML = ''; // Clear previous results

                            data.forEach(item => {
                                console.log("00000000000000")
                                const div = document.createElement('div');
                                div.classList.add('dropdown-item');
                                div.textContent = item.BusinessName;
                                div.addEventListener('click', () => {
                                    // Populate fields when a company is selected
                                    populateCompanyDetails(item);
                                    companyNameInput.value = item.BusinessName; // Set selected company name
                                    dropdown.innerHTML = ''; // Clear results after selection
                                    dropdown.style.display = 'none'; // Hide dropdown after selection
                                });
                                dropdown.appendChild(div);
                            });

                            // Show dropdown if there are results
                            dropdown.style.display = data.length > 0 ? 'block' : 'none';
                        });
                } else {
                    dropdown.style.display = 'none'; // Hide dropdown if input is empty
                }
            });

            // Function to populate company details into input fields
            function populateCompanyDetails(item) {

                console.log("item", item)
                phoneInput.value = item.BusinessPhone;
                addressInput.value = item.BusinessAddress;
                countryInput.value = item.country;
                const countrySelect = document.getElementById("country");
                const provinceSelect = document.getElementById("province");

                provinceSelect.innerHTML = ""; // Clear the province dropdown

                if (countrySelect.value === "Canada") {
                    const canadianProvinces = [
                        "Alberta", "British Columbia", "Manitoba", "New Brunswick",
                        "Newfoundland and Labrador", "Nova Scotia", "Ontario",
                        "Prince Edward Island", "Quebec", "Saskatchewan"
                    ];
                    canadianProvinces.forEach(province => {
                        const option = document.createElement("option");
                        option.value = province;
                        option.textContent = province;
                        provinceSelect.appendChild(option);
                    });
                } else if (countrySelect.value === "USA") {
                    const usStates = [
                        "California", "Texas", "Florida", "New York", "Illinois"
                    ];
                    usStates.forEach(state => {
                        const option = document.createElement("option");
                        option.value = state;
                        option.textContent = state;
                        provinceSelect.appendChild(option);
                    });
                } else {
                    const defaultOption = document.createElement("option");
                    defaultOption.value = "";
                    defaultOption.textContent = "Select your province";
                    provinceSelect.appendChild(defaultOption);
                }
                provinceInput.value = item.province;
                websiteInput.value = item.BusinessWebsite;
                phoneInput.disabled = true
                addressInput.disabled = true
                countryInput.disabled = true
                provinceInput.disabled = true
                websiteInput.disabled = true

            }

            // Function to reset the company details
            function resetCompanyDetails() {
                phoneInput.value = '';
                addressInput.value = '';
                countryInput.value = '';
                provinceInput.value = '';
                websiteInput.value = '';
                phoneInput.disabled = false
                addressInput.disabled = false
                countryInput.disabled = false
                provinceInput.disabled = false
                websiteInput.disabled = false
            }
        })
    </script>

    <script>
        function validateForm() {
            const user_email = document.getElementById("username");
            const confirmEmail = document.getElementById("confirmEmail");
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const termsCheckbox = document.getElementById("terms");
            const registerButton = document.getElementById("registerButton");
            const company_email = document.getElementById("BusinessWebsite").value;
            const BusinessPhone = document.getElementById("BusinessPhone").value;
            const BusinessAddress = document.getElementById("BusinessAddress").value.trim();
            const regex = /^\(\d{3}\) \d{3}-\d{4}$/;
            if (regex.test(BusinessPhone)) {
                document.getElementById("phoneError").textContent = "";
            } else {
                document.getElementById("phoneError").textContent = "Phone Number format like: (xxx) xxx-xxxx";
            }

            let isValid = true;


            const addressPattern = /, *([^,]+), *([^,]+)/;
            const match = BusinessAddress.match(addressPattern);

            if (!match) {
                document.getElementById('addressError').textContent = 'Providing a full address helps ensure accurate company identification and project tracking. Only city and province are required at this time.';
                const addressParts = BusinessAddress.split(',')
                const trimmedParts = addressParts.map(part => part.trim());

                if (trimmedParts.length == 2 || trimmedParts.length == 3) {
                    document.getElementById('addressError').textContent = ''
                    isValid = true;
                } else {
                    document.getElementById('addressError').textContent = 'Providing a full address helps ensure accurate company identification and project tracking. Only city and province are required at this time.';
                    isValid = false;
                }
            }

            const user_domain = user_email.value.split('@')[1];
            const company_domain = company_email.split('.').slice(-2).join('.');

            if (user_domain !== company_domain) {
                document.getElementById("domainError").textContent = "Email must match company domain";
            } else {
                document.getElementById("domainError").textContent = "";
            }


            // Email Validation
            if (user_email.value !== confirmEmail.value || !user_email.value) {
                document.getElementById("emailError").textContent = "Emails do not match.";
                isValid = false;
            } else {
                document.getElementById("emailError").textContent = "";
            }

            // Password Validation
            const passwordValidationMessage = document.getElementById("passwordError")
            const passwordValidationMessage_match = document.getElementById("passwordMatch")
            const minLengthPattern = /^.{8,}$/; // At least 8 characters
            const upperCasePattern = /[A-Z]/; // At least one uppercase letter
            const lowerCasePattern = /[a-z]/; // At least one lowercase letter
            const numberPattern = /\d/; // At least one number
            const specialCharPattern = /[!@#$%^&*(),.?":{}|<>]/; // At least one special character

            if (password !== confirmPassword || !password) {
                passwordValidationMessage_match.textContent = "Passwords do not match.";
                isValid = false;
            } else {
                passwordValidationMessage_match.textContent = "";
            }

            if (minLengthPattern.test(password) && upperCasePattern.test(password)
                && lowerCasePattern.test(password) && numberPattern.test(password)
                && specialCharPattern.test(password)) {
                passwordValidationMessage.textContent = "";
            } else {
                passwordValidationMessage.textContent = "Password must contain at least 8 characters, including uppercase, lowercase, number, and special character."
                isValid = false;
            }

            // Enable/Disable Register Button
            registerButton.disabled = !termsCheckbox.checked || !isValid;

            return isValid;
        }

        function setupValidation() {
            const inputs = document.querySelectorAll("#username, #confirmEmail, #password, #confirmPassword, #terms");
            inputs.forEach(input => input.addEventListener("input", validateForm));
        }

        document.addEventListener("DOMContentLoaded", setupValidation);
    </script>



</head>

<body>
    <!-- Header Section -->
    <div class="header">
        <div class="left-nav">
            <a href="/">
                <img src="/static/images/constructhub-logo.png" alt="ConstructHub Logo" class="logo">
            </a>
        </div>
        <nav>
            <a></a>
        </nav>
    </div>






    <!-- Registration Form Section -->
    <div class="registration-form">
        <h1>Create an Account</h1>
        <form id="register_form">


            <!-- Division -->
            <div class="form-group">
                <label for="division">Division</label>
                <select id="division" name="division" required>
                    <option value="">Select your division</option>
                    <option value="1">General Contractor</option>
                    <option value="2">Division 2: Demolition</option>
                    <option value="3">Division 3: Concrete</option>
                    <option value="4">Division 4: Masonry</option>
                    <option value="5">Division 5: Metals</option>
                    <option value="6">Division 6: Wood and plastics</option>
                    <option value="7">Division 7: Thermal and moisture protection</option>
                    <option value="8">Division 8: Doors and windows</option>
                    <option value="9">Division 9: Finishes</option>
                    <option value="10">Division 10: Specialties</option>
                    <option value="11">Division 11: Equipment</option>
                    <option value="12">Division 12: Furnishings</option>
                    <option value="13">Division 13: Special construction</option>
                    <option value="14">Division 14: Conveying systems</option>
                    <option value="15">Division 15: Mechanical</option>
                    <option value="16">Division 16: Electrical</option>
                </select>
            </div>

            <!-- Business Name -->
            <div class="form-group">
                <label for="BusinessName">Business Name</label>
                <input type="text" id="BusinessName" name="BusinessName" required placeholder="Enter business name">
                <div id="dropdown" class="dropdown">
                    <!-- Search results will be populated here -->
                </div>
            </div>

            <!-- Business Phone -->
            <div class="company-details">
                <div class="form-group">
                    <label for="BusinessPhone">Business Phone</label>
                    <input type="text" id="BusinessPhone" name="BusinessPhone" required
                        placeholder="Enter Business Phone Number">
                    <div class="error" id="phoneError"></div>
                </div>

                <!-- Business Address -->
                <div class="form-group">
                    <label for="BusinessAddress">Business Address</label>
                    <input type="text" id="BusinessAddress" name="BusinessAddress" required
                        placeholder="e.g., 123 Main St, Springfield, Ontario">
                    <div class="error" id="addressError"></div>
                </div>

                <!-- Country -->
                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country" name="country" onchange="updateProvinces()" required>
                        <option value="">Select your country</option>
                        <option value="Canada">Canada</option>
                    </select>
                </div>

                <!-- Province -->
                <div class="form-group">
                    <label for="province">Province</label>
                    <select id="province" name="province" required>
                        <option value="">Select your province</option>
                    </select>
                </div>

                <!-- Business Website -->
                <div class="form-group">
                    <label for="BusinessWebsite">Business Website</label>
                    <input type="text" id="BusinessWebsite" name="BusinessWebsite" required
                        placeholder="Enter Business Website" required oninput="validateForm()">
                </div>
            </div>

            <!-- Personal Information -->
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required placeholder="Enter first name">
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required placeholder="Enter last name">
            </div>

            <div class="form-group">
                <label for="mobileNumber">Mobile Number</label>
                <input type="text" id="mobileNumber" name="mobileNumber" required placeholder="Enter mobile number">
            </div>

            <div class="form-group">
                <label for="username">Username (Email Address)</label>
                <input type="email" id="username" name="username" placeholder="Enter email address" required
                    oninput="validateForm()">
                <div class="error" id="domainError"></div>
            </div>

            <div class="form-group">
                <label for="confirmEmail">Confirm Email Address</label>
                <input type="email" id="confirmEmail" name="confirmEmail" placeholder="Confirm email address" required
                    oninput="validateForm()">
                <div class="error" id="emailError"></div> <!-- Error message for emails -->
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required
                    oninput="validateForm()">
                <div class="error" id="passwordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password"
                    required oninput="validateForm()">
                <div class="error" id="passwordMatch"></div> <!-- Error message for passwords -->
            </div>








            <!-- Terms and Agreement -->
            <div class="terms">
                <label>
                    <input type="checkbox" id="terms" required>
                    I agree that any information entered into the website or database becomes the sole property of
                    ConstructHub, and I have read and accept the terms and agreements.
                </label>
            </div>






            <!-- Submit Button -->
            <div class="form-actions">
                <button type="submit" id="registerButton" disabled>Register</button>
            </div>
        </form>
    </div>




    <script>
        function updateProvinces() {
            const countrySelect = document.getElementById("country");
            const provinceSelect = document.getElementById("province");

            provinceSelect.innerHTML = ""; // Clear the province dropdown

            if (countrySelect.value === "Canada") {
                const canadianProvinces = [
                    "Alberta", "British Columbia", "Manitoba", "New Brunswick",
                    "Newfoundland and Labrador", "Nova Scotia", "Ontario",
                    "Prince Edward Island", "Quebec", "Saskatchewan"
                ];
                canadianProvinces.forEach(province => {
                    const option = document.createElement("option");
                    option.value = province;
                    option.textContent = province;
                    provinceSelect.appendChild(option);
                });
            } else if (countrySelect.value === "USA") {
                const usStates = [
                    "California", "Texas", "Florida", "New York", "Illinois"
                ];
                usStates.forEach(state => {
                    const option = document.createElement("option");
                    option.value = state;
                    option.textContent = state;
                    provinceSelect.appendChild(option);
                });
            } else {
                const defaultOption = document.createElement("option");
                defaultOption.value = "";
                defaultOption.textContent = "Select your province";
                provinceSelect.appendChild(defaultOption);
            }
        }
    </script>
    <script>
        document.getElementById('register_form').addEventListener('submit', function (event) {
            event.preventDefault();
            const division = document.getElementById('division').value;
            const BusinessName = document.getElementById('BusinessName').value;
            const BusinessPhone = document.getElementById('BusinessPhone').value;
            const BusinessAddress = document.getElementById('BusinessAddress').value;
            const country = document.getElementById('country').value;
            const province = document.getElementById('province').value;
            const BusinessWebsite = document.getElementById('BusinessWebsite').value;
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const mobileNumber = document.getElementById('mobileNumber').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch('register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    division, BusinessAddress, BusinessName, BusinessPhone,
                    country, province, BusinessWebsite, lastName, firstName, mobileNumber, username, password
                })
            }).then(response => {
                return response.json().then(data => {
                    if (!response.ok) {
                        // If error occurs, we throw an error with the message from the server
                        throw new Error(data.message || 'Register failed!');
                    }
                    return data; // Return the data for further processing if login is successful
                });
            })
                .then(data => {
                    window.location.href = '/login'
                })
                .catch(error => {
                    // You may want to display the error message on the UI
                    alert(error.message); // For example, alert the user of the error
                });
        })
    </script>
