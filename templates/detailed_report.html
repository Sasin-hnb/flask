
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Construction Portal</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('/static/images/dashboard_faded.jpg'); /* Faded user dashboard image */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Header Section */
        .header {
            background-color: #003366;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .header .left-nav {
            display: flex;
            align-items: center;
        }

        .header .logo {
            font-size: 1.5em;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin: 0 35px;
            font-size: 1.2em;
        }

        .header a:hover {
            text-decoration: underline;
        }

        /* Login Form */
        .login-container {
            background-color: rgba(255, 255, 255, 0.9); /* White with transparency */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        .login-container h1 {
            color: #003366;
            margin-bottom: 20px;
        }

        .login-container .form-group {
            margin-bottom: 15px;
        }

        .login-container .form-group label {
            display: block;
            font-size: 1em;
            color: #333;
            margin-bottom: 5px;
        }

        .login-container .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-container .form-group input:focus {
            outline: none;
            border-color: #003366;
        }

        .login-container .form-actions button {
            background-color: #003366;
            color: white;
            padding: 12px 20px;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .login-container .form-actions button:hover {
            background-color: #d0e0f5;
            color: #003366;
        }

        /* Footer Section */
        .footer {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 15px 20px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

    </style>
</head>
<body>
    <!-- Header Section -->
    <div class="header">
        <div class="left-nav">
            <a href="/">
                <img src="/static/images/constructhub-logo.png" alt="ConstructHub Logo" class="logo">
            </a>
        </div>
        <nav>
            <a></a>
        </nav>
    </div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Reports</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h2>Detailed Reports</h2>
        <canvas id="reportChart" width="400" height="200"></canvas>
        <button>Download Report</button>
    </div>
    <script>
        const ctx = document.getElementById('reportChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
                datasets: [{
                    label: 'Project Activity',
                    data: [12, 19, 3, 5, 2],
                    backgroundColor: 'rgba(0, 102, 204, 0.7)',
                    borderColor: 'rgba(0, 102, 204, 1)',
                    borderWidth: 1
                }]
            },
            options: { responsive: true }
        });
    </script>
</body>
</html>






    <!-- Footer Section -->
    <div class="footer">
        <p>&copy; 2024 ConstructHub. All rights reserved.</p>
    </div>
</body>
</html>
