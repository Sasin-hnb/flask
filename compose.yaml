version: "3.9"
name: flask
services:
  flask:
    restart: unless-stopped
    build:
      context: ./flask
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          cpus: "1.0"
          memory: 512M
    ports:
      - mode: ingress
        target: 5000
        published: 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]

version: '3'
services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

